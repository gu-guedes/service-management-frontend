<div class="layout-shell" [class.single-column]="isFullScreenRoute()">
  <div class="sidebar-backdrop" *ngIf="isMobileMenuOpen()" (click)="closeMobileMenu()"></div>

  <aside class="sidebar" [class.mobile-open]="isMobileMenuOpen()" *ngIf="!isFullScreenRoute()">
    <header class="brand">
      <p class="brand-title">VetCare</p>
      <p class="brand-subtitle">Gestao Clinica</p>
    </header>

    <nav class="main-nav" aria-label="Navegacao principal">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
        (click)="closeMobileMenu()"
      >
        <span>{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <footer class="profile">
      <div class="avatar">DM</div>
      <div>
        <p class="profile-name">Dra. Marina</p>
        <p class="profile-role">Veterinaria</p>
      </div>
      <button type="button" class="ghost-btn" (click)="logout()">Sair</button>
    </footer>
  </aside>

  <main class="main-content" [class.full-screen]="isFullScreenRoute()">
    <ng-container *ngIf="!isFullScreenRoute()">
      <header class="topbar">
        <button type="button" class="hamburger-btn" aria-label="Abrir menu" (click)="toggleMobileMenu()">☰</button>

        <div>
          <h1>VetCare</h1>
        </div>

        <div class="topbar-actions">
          <button type="button" class="primary-btn" (click)="quickModal.openTutorInfo()">Novo Tutor</button>
          <button type="button" class="primary-btn" (click)="quickModal.openPetChoice()">Novo Pet</button>
        </div>
      </header>

      <section class="tabs" aria-label="Secoes principais">
        <a routerLink="/app/pets" routerLinkActive="active">Fichas de Pets</a>
        <a routerLink="/app/tutors" routerLinkActive="active">Tutores</a>
      </section>
    </ng-container>

    <router-outlet />
  </main>
</div>

<!-- Modais compartilhados — montados uma vez, abertos de qualquer pagina via ModalStateService -->
<app-pet-detail-modal />
<app-tutor-detail-modal />
<app-quick-registration-modal #quickModal />
<app-product-application-modal />
